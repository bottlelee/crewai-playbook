[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crewai-playbook"
version = "0.1.0"
description = "Ansible-compatible YAML playbook orchestrator for crewAI agents"
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.100.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
crewai-playbook = "crewai_playbook.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
