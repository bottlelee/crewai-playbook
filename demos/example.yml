# =============================================================================
# crewai-playbook Demo
# =============================================================================
# Run:  crewai-playbook run docs/crewai_playbook/example.yml
# Check: crewai-playbook --check docs/crewai_playbook/example.yml
# Lint:  crewai-playbook lint docs/crewai_playbook/example.yml
# =============================================================================

- name: "Research & Writing Pipeline"
  agents:
    - manager
    - researcher
    - writer
    - reviewer
  gather_facts: true
  process: hierarchical         # manager coordinates tasks
  vars:
    topic: "What is CrewAI and how does it work?"

  tasks:
    - name: "Research the topic"
      agents:
        - researcher
      task: >
        Research the topic "{{ topic }}" and provide key findings,
        recent developments, and expert opinions.
      dest: "{{ playbook_dir }}/output/{{ topic }}/research.md"

    - name: "Write article"
      agents:
        - writer
      task: >
        Based on the research findings of "{{ topic }}",
        write a well-structured article.
      src: "{{ playbook_dir }}/output/{{ topic }}/research.md"
      dest: "{{ playbook_dir }}/output/{{ topic }}/article.md"

    - name: "Review article"
      agents:
        - reviewer
      task: >
        Review the article about {{ topic }} for quality and completeness.
      src: "{{ playbook_dir }}/output/{{ topic }}`/article.md"
      dest: "{{ playbook_dir }}/output/{{ topic }}/review.md"
      notify:
        - LogCompletion

    - name: "Enrich article"
      agents:
        - writer
      task: >
        Based on the review of "{{ topic }}",
        Enrich the article.
      src: "{{ playbook_dir }}/output/{{ topic }}/review.md"
      dest: "{{ playbook_dir }}/output/{{ topic }}/article.md"

  handlers:
    - name: "LogCompletion"
      tasks:
        - name: "Log to console"
          agents:
            - reviewer
          task: "All tasks completed successfully for {{ topic }}"


